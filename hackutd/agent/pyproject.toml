[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-agent"
version = "0.1.0"
description = "SentinelOS X - NVIDIA Nemotron autonomous cyber-incident investigation service (simulated infrastructure only)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "pydantic>=2.6,<3",
    "httpx>=0.27",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sentinel_agent = ["fixtures/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "live_nvidia: calls the real NVIDIA API; skipped unless NVIDIA_API_KEY is set and RUN_LIVE_NVIDIA_TESTS=1",
]
