# NVIDIA OpenShell sandbox policy for the SentinelOS X Nemotron investigator.
# Schema: https://docs.nvidia.com/openshell/latest/reference/policy-schema
#
# Least privilege:
#  - Network: ONLY the NVIDIA inference API (HTTP-inspected, POST/GET) and the
#    SpacetimeDB server on the host. Nothing else leaves the sandbox.
#  - Filesystem: the uploaded agent bundle is read-only; only the workdir is writable
#    (for the agent's SpacetimeDB identity token).
#  - Credentials: NVIDIA_API_KEY is injected by the `nvidia` provider for
#    integrate.api.nvidia.com only; the agent process never sees the real key.
version: 1

filesystem_policy:
  include_workdir: true
  read_only:
    - /usr
    - /lib
    - /etc
    - /sandbox/app

landlock:
  compatibility: best_effort

process:
  run_as_user: sandbox
  run_as_group: sandbox

network_policies:
  nvidia_inference:
    name: nvidia-inference
    endpoints:
      - host: integrate.api.nvidia.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: POST, path: /v1/chat/completions }
          - allow: { method: GET, path: /v1/models }
    binaries:
      - path: /usr/local/bin/node
  spacetimedb_host:
    name: spacetimedb-host
    endpoints:
      # SpacetimeDB on the machine running the OpenShell gateway (`spacetime start`).
      # Native TCP: the SDK uses a WebSocket with binary BSATN frames.
      - host: host.openshell.internal
        port: 3000
        protocol: tcp
    binaries:
      - path: /usr/local/bin/node
